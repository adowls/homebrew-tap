name: Auto Bump Casks

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）运行
    - cron: '0 2 * * *'
  workflow_dispatch: # 支持手动点击触发

permissions:
  contents: write

jobs:
  bump-casks:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and bump outdated casks
        run: |
          # 禁用终端颜色输出
          export HOMEBREW_NO_COLOR=1
          export NO_COLOR=1

          # 1. 注册本地 Tap
          brew tap adowls/tap "$GITHUB_WORKSPACE"

          # 2. 以 JSON 纯文本格式检查更新，杜绝任何颜色字符干扰
          UPDATES_JSON=$(brew livecheck --tap adowls/tap --newer-only --json || true)

          # 检查是否有更新项
          COUNT=$(echo "$UPDATES_JSON" | jq '. | length' 2>/dev/null || echo 0)
          if [ "$COUNT" -eq 0 ]; then
            echo "✔ 所有软件均已是最新版本，无需修改。"
            exit 0
          fi

          echo "发现 $COUNT 个软件需要更新！"

          # 3. 遍历解析出来的软件名和最新版本
          echo "$UPDATES_JSON" | jq -r '.[] | "\(.cask | split("/") | last) \(.version.latest)"' | while read -r cask_name latest_ver; do
            [ -z "$cask_name" ] && continue

            echo "--------------------------------------------------"
            echo "正在处理: $cask_name -> 目标版本: $latest_ver"

            # 动态查找文件真实路径（兼顾 Casks/i4tools.rb 或 Casks/i/i4tools.rb）
            rb_file=$(find Casks -name "${cask_name}.rb" -print -quit)

            if [ -z "$rb_file" ] || [ ! -f "$rb_file" ]; then
              echo "错误: 未在 Casks 目录下找到 ${cask_name}.rb 文件，跳过"
              continue
            fi
            echo "匹配到文件: $rb_file"

            # 提取旧版本号
            old_ver=$(grep -E '^\s*version\s+"' "$rb_file" | sed -E 's/.*version "([^"]+)".*/\1/' || true)

            if [ "$old_ver" = "$latest_ver" ]; then
              echo "$cask_name 已经是最新版本 ($old_ver)，无需更新。"
              continue
            fi

            # 替换版本号为最新版本
            sed -i '' -E "s/version \"$old_ver\"/version \"$latest_ver\"/" "$rb_file"

            # 获取真实下载直链
            download_url=$(brew ruby -e 'puts Cask::CaskLoader.load("adowls/tap/'"$cask_name"'").url.to_s' 2>/dev/null || true)
            if [ -z "$download_url" ]; then
              raw_url=$(grep -E '^\s*url\s+"' "$rb_file" | head -n1 | sed -E 's/.*url "([^"]+)".*/\1/')
              download_url=$(echo "$raw_url" | sed "s/#{version}/$latest_ver/g")
            fi

            echo "正在下载安装包并计算哈希: $download_url"
            new_sha=$(curl -fsSL "$download_url" | shasum -a 256 | awk '{print $1}')

            if [ -z "$new_sha" ] || [ ${#new_sha} -ne 64 ]; then
              echo "错误: 下载失败或哈希无效，正在回滚 $cask_name..."
              git checkout -- "$rb_file"
              continue
            fi

            echo "计算完成: sha256 = $new_sha"

            # 兼容替换：无论是 64位旧哈希 还是 :no_check 都能准确替换
            if grep -qE '[0-9a-f]{64}' "$rb_file"; then
              sed -i '' -E "s/[0-9a-f]{64}/$new_sha/g" "$rb_file"
            elif grep -q ':no_check' "$rb_file"; then
              sed -i '' -E "s/:no_check/\"$new_sha\"/" "$rb_file"
            fi

            echo "✔ $cask_name 已成功更新至 $latest_ver"
          done

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain Casks/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Casks/
            git commit -m "chore(casks): auto bump casks to latest versions"
            git push
            echo "✔ 新版本已自动推送到仓库！"
          else
            echo "没有产生任何文件改动。"
          fi
