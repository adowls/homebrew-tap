name: Sync Apps and Update Casks

on:
  schedule:
    - cron: '0 3 * * *' # 每天北京时间 11:00 自动检查
  workflow_dispatch:     # 支持手动点按钮测试

permissions:
  contents: write # 必须具备 write 权限以创建 Release 和提交代码

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: updater/package.json

      - name: Install dependencies
        working-directory: updater
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Updater
        working-directory: updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node sync.mjs

      - name: Commit & Push Cask Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/*.rb
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto update casks [skip ci]"
            git push
          else
            echo "No cask changes to commit."
          fi